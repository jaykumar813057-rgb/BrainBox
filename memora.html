<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0720">
<title>MEMORA - Memory Game</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
#lives{height:22px;text-align:center;font-size:16px;letter-spacing:2px;margin-top:2px}
.timer{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
#timerBar{height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#06d6a0,#ffd166);transition:width .15s linear,background .3s}
#timerBar.low{background:linear-gradient(90deg,#ef476f,#ff9f1c)}
.timer.frozen #timerBar{background:linear-gradient(90deg,#7dd3fc,#e0f2fe);box-shadow:0 0 16px #7dd3fc}
#timerTxt{font-weight:800;min-width:42px;text-align:right}
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{display:grid;justify-content:center;padding:12px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 60px -20px rgba(0,0,0,.7),0 0 50px -18px var(--a1),inset 0 1px 0 rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.card{width:var(--sz);height:var(--sz);perspective:700px;cursor:pointer;touch-action:manipulation;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1.15)}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--sz)*.22);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
.front{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 8px 18px rgba(0,0,0,.4);color:rgba(255,255,255,.8);font-size:calc(var(--sz)*.4)}
.front::before{content:"";position:absolute;inset:7%;border-radius:calc(var(--sz)*.17);border:1.5px dashed rgba(255,255,255,.35)}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 4s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,#e4e0ff);font-size:calc(var(--sz)*.55);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.card.match{animation:matchPop .55s}
.card.match .back{background:linear-gradient(160deg,#d1fae5,#6ee7b7);box-shadow:0 0 26px #34d399aa}
@keyframes matchPop{40%{transform:scale(1.18)}100%{transform:scale(1)}}
.card.shake .in{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-7px)}75%{transform:rotateY(180deg) translateX(7px)}}
.card.wobble{animation:wob .45s}
@keyframes wob{25%{transform:rotate(-9deg) scale(.9)}75%{transform:rotate(9deg) scale(1.08)}}
.moves{flex:1;text-align:center;opacity:.85;font-weight:700}.moves b{font-size:20px}
.mini{width:56px;height:56px;perspective:300px}
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i></div>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>

<main id="app">
 <!-- HOME -->
 <section id="home" class="screen active">
  <div class="topbar">
   <a class="icon" href="index.html">‹</a>
   <div class="pbar" id="pbar"></div>
   <button class="icon" onclick="settingsModal()">⚙</button>
  </div>
  <div class="hero">
   <div class="floaty" id="mLogo"></div>
   <div class="wordmark glitch" data-text="MEMORA">MEMORA</div>
   <div class="tagline">Dimaag ko challenge do</div>
  </div>
  <div class="menu">
   <button class="btn big primary" onclick="playCurrent()"><span class="bi">▶</span><span class="bt">PLAY<small id="curLabel"></small></span></button>
   <div class="row2">
    <button class="btn big" onclick="openLevels()"><span class="bi">🗺</span>Levels</button>
    <button class="btn big" onclick="startDaily()"><span class="bi">📅</span>Daily <span id="dailyBadge"></span></button>
   </div>
   <div class="row2">
    <button class="btn big" onclick="startZen()"><span class="bi">🧘</span>Zen</button>
    <button class="btn big" id="btnLB" onclick="lbOpen()" style="display:none"><span class="bi">🏆</span>Ranks</button>
   </div>
  </div>
 </section>

 <!-- LEVEL MAP -->
 <section id="levels" class="screen">
  <div class="topbar"><button class="icon" onclick="go('home')">‹</button><div class="pbar" id="pbar2"></div></div>
  <div id="wmBox" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
 </section>

 <!-- GAME -->
 <section id="game" class="screen">
  <header class="hud">
   <button class="icon" onclick="pauseGame()">⏸</button>
   <div class="hud-mid"><div id="lvlName"></div><div class="tag-mod" id="modTag"></div><div class="combo" id="combo"></div></div>
   <div class="scorebox"><small>SCORE</small><b id="score">0</b></div>
  </header>
  <div class="timer" id="timerWrap"><div class="track"><div id="timerBar"></div></div><span id="timerTxt"></span></div>
  <div id="lives"></div>
  <div id="boardWrap"><div id="board"></div></div>
  <footer class="power">
   <button class="pw" id="pPeek" onclick="usePeek()">👁 Peek <em id="nPeek">2</em></button>
   <div class="moves">Moves <b id="moves">0</b></div>
   <button class="pw" id="pFreeze" onclick="useFreeze()">❄ Freeze <em id="nFreeze">1</em></button>
  </footer>
 </section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="core.js"></script>
<script src="lb.js"></script>
<script>
Sky.init('hub');fxInit();

/* ---------- DATA ---------- */
const PACKS=[
 ['🐶','🐱','🦁','🐼','🦊','🐸','🐵','🐯','🐨','🐰','🦄','🐙','🦋','🐢','🐧','🦉','🐳','🦒'],
 ['🍕','🍔','🍟','🌮','🍩','🍦','🍓','🍉','🍇','🥑','🍪','🍿','🍣','🥐','🍒','🥭','🍌','🧁'],
 ['🚀','🌍','🌙','⭐','☀️','🪐','👽','🛸','☄️','🌌','🔭','🛰️','🌠','🌟','🌑','⚡','🔥','💫'],
 ['😀','😎','🤩','🥳','😍','🤯','😴','🤖','👻','💀','🎃','😈','🥶','🤠','😇','🤡','🙈','😱']
];
const MODS={
 shuffle:{n:'SHUFFLE',i:'🔀',d:'Cards khud badal jate hain'},
 lives:{n:'LIVES',i:'❤️',d:'Galtiyan limited hain'},
 fog:{n:'FOG',i:'🌫',d:'Cards jaldi chhup jate hain'},
 rush:{n:'RUSH',i:'⚡',d:'Timer tez chalta hai'}
};
const PL=[2,3,4,5,6,7,8,9,10,12,14,15,16,18];

/* infinite level generator */
function levelSpec(n){
 const pairs=PL[Math.min(PL.length-1,Math.floor((n+1)/3))];
 const boss=n%10===0;
 let mods=[];
 if(boss)mods=['lives','shuffle'];
 else if(n>=6){const m=[null,'shuffle','lives','fog','rush',null][hash('m'+n)%6];if(m)mods=[m]}
 if(boss&&n>=50)mods.push('fog');
 const time=Math.round(Math.max(pairs*4+10,(pairs*8+16)*Math.max(.7,1-n/600))*(boss?1.15:1));
 const lives=mods.includes('lives')?Math.max(4,Math.round(pairs*(boss?.75:.55))+1-Math.floor(n/80)):0;
 return{pairs,time,mods,lives,boss,pack:worldOf(n).w%4,peeks:mods.includes('fog')?1:2};
}

/* ---------- SAVE ---------- */
let S={unlocked:1,stars:{},daily:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('memora_v2')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('memora_v2',JSON.stringify(S))}catch(e){}}
function onReset(){
 if(!confirm('Memora ka saara progress delete ho jayega. Pakka?'))return;
 S={unlocked:1,stars:{},daily:{}};save();closeModal();refreshHome();toast('Progress reset ho gaya');
}

/* ---------- SCREENS ---------- */
function onScreen(id){Sky.setMode(id==='home'?'hub':'game')}
function refreshHome(){
 const w=worldOf(S.unlocked);setPalette(w.h1,w.h2);
 $('pbar').innerHTML=Player.bar();
 $('mLogo').innerHTML=logoMemora(150);
 $('curLabel').textContent='Level '+S.unlocked+' · '+w.name;
 $('dailyBadge').textContent=S.daily[todayStr()]?'✅':'';
 $('btnLB').style.display=LB.on?'flex':'none';
}
let mapW=0;
function openLevels(){mapW=Math.floor((S.unlocked-1)/10);renderMap();go('levels');setTimeout(mapFocus,60)}
function renderMap(){
 $('pbar2').innerHTML=Player.bar();
 const w=worldOf(mapW*10+1);setPalette(w.h1,w.h2);
 $('wmBox').innerHTML=mapPage(mapW,{unlocked:S.unlocked,starsOf:n=>S.stars[n]||0,pick:'startLevel',subOf:n=>levelSpec(n).pairs+' pairs'});
}
function mapNav(d){mapW=Math.max(0,mapW+d);renderMap();setTimeout(mapFocus,30)}
function playCurrent(){startLevel(S.unlocked)}
function startLevel(n){
 const sp=levelSpec(n);
 startGame(Object.assign({mode:'campaign',lvl:n,name:'Level '+n},sp));
}
function startDaily(){const d=todayStr();startGame({mode:'daily',date:d,seed:hash('memora'+d),pairs:8,time:0,mods:[],lives:0,pack:hash(d)%4,peeks:2,name:'📅 Daily '+d.slice(5)})}
function startZen(){startGame({mode:'zen',pairs:8,time:0,mods:[],lives:0,pack:Math.floor(Math.random()*4),peeks:2,name:'🧘 Zen Mode'})}

/* ---------- GAME CORE ---------- */
let G=null,tm=0;
const FAILS={};
function skipLevel(n){S.unlocked=Math.max(S.unlocked,n+1);save();startLevel(n+1)}
function startGame(cfg){
 closeModal();clearInterval(tm);
 G=Object.assign({},cfg,{cfg,moves:0,score:0,combo:0,maxCombo:0,matched:0,open:[],lock:false,started:false,paused:false,over:false,frozenUntil:0,peeks:cfg.peeks,freezes:1,left:cfg.time,bonus:0,last:0,livesLeft:cfg.lives||0});
 if(cfg.mode==='campaign'){const w=worldOf(cfg.lvl);setPalette(w.h1,w.h2)}
 const r=cfg.seed?rng(cfg.seed):Math.random;
 const set=shuffleArr(PACKS[cfg.pack],r).slice(0,cfg.pairs);
 const deck=shuffleArr([...set,...set],r);
 const b=$('board');b.innerHTML='';
 G.cards=deck.map((e,i)=>{
  const el=document.createElement('div');el.className='card';
  el.innerHTML='<div class="in"><div class="face front"><span>✦</span></div><div class="face back"><span>'+e+'</span></div></div>';
  el.style.animationDelay=(i*24)+'ms';
  el.onclick=()=>flip(i);
  b.appendChild(el);
  return{e,el,s:0};
 });
 $('lvlName').textContent=cfg.name;
 $('modTag').textContent=cfg.mods.length?cfg.mods.map(m=>MODS[m].i+' '+MODS[m].n).join('  ·  ')+(cfg.boss?'  ·  👑 BOSS':''):(cfg.boss?'👑 BOSS':'');
 $('timerWrap').style.display=cfg.time?'flex':'none';
 $('pFreeze').style.visibility=cfg.time?'visible':'hidden';
 $('timerWrap').classList.remove('frozen');
 $('moves').textContent=0;$('score').textContent=0;
 updHUD();updTimer();renderLives();go('game');requestAnimationFrame(fit);
 if(cfg.boss)banner('👑 BOSS LEVEL',cfg.mods.map(m=>MODS[m].d).join(' · '));
 else if(cfg.mods.length)banner(MODS[cfg.mods[0]].i+' '+MODS[cfg.mods[0]].n,MODS[cfg.mods[0]].d);
 else if(cfg.mode==='campaign'&&cfg.lvl===1)toast('Cards par tap karo, jodi dhoondo! 👆');
}
function bestCols(count,W,H,gap){
 let best=null;
 for(let c=2;c<=7;c++){
  const r=Math.ceil(count/c);
  if(c*r-count>=c)continue;
  const waste=c*r-count,sz=Math.min((W-gap*(c-1))/c,(H-gap*(r-1))/r),score=sz*(waste?.82:1);
  if(!best||score>best.score)best={c,r,sz,score};
 }
 return best||{c:4,sz:60};
}
function fit(){
 if(!G)return;
 const w=$('boardWrap');if(!w.clientWidth)return;
 const P=12,gap=8,b=bestCols(G.cards.length,w.clientWidth-P*2,w.clientHeight-P*2,gap);
 const sz=Math.max(34,Math.floor(Math.min(b.sz,120)));
 const el=$('board');
 el.style.gridTemplateColumns='repeat('+b.c+','+sz+'px)';el.style.gap=gap+'px';el.style.setProperty('--sz',sz+'px');
}
addEventListener('resize',fit);
function renderLives(){
 const L=G&&G.mods.includes('lives')?G.livesLeft:0;
 $('lives').textContent=L>0?(L>9?'❤️ × '+L:'❤️'.repeat(L)):'';
}
function burstAt(el,pts){
 const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 burst(x,y);
 if(pts){const f=document.createElement('div');f.className='float';
  f.textContent='+'+pts+(G.combo>1?'  🔥x'+G.combo:'');f.style.left=x+'px';f.style.top=y+'px';
  document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
}
const sfx={
 flip:()=>tone(520,.08,'triangle',.12),
 match:()=>[660,880,1100].forEach((f,i)=>tone(f,.18,'sine',.15,i*.07)),
 miss:()=>tone(200,.22,'sawtooth',.07),
 pow:()=>{tone(300,.15,'square',.07);tone(600,.2,'square',.07,.1)}
};
function flip(i){
 if(!G||G.over||G.paused||G.lock)return;
 const c=G.cards[i];if(c.s)return;
 if(!G.started){G.started=true;G.last=performance.now();timerStart()}
 c.s=1;c.el.style.animationDelay='0s';c.el.classList.add('flip');sfx.flip();vib(8);
 G.open.push(i);
 if(G.open.length<2)return;
 G.moves++;$('moves').textContent=G.moves;
 const a=G.cards[G.open[0]],b=G.cards[G.open[1]];G.open=[];G.lock=true;
 if(a.e===b.e){
  setTimeout(()=>{
   a.s=b.s=2;
   [a,b].forEach(x=>{x.el.style.animationDelay='0s';x.el.classList.add('match')});
   G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
   const pts=100*G.combo;G.score+=pts;
   sfx.match();vib([20,30,20]);
   burstAt(a.el,pts);burstAt(b.el);
   G.matched++;G.lock=false;updHUD(true);
   if(G.matched===G.pairs)win();else afterPair();
  },380);
 }else{
  G.combo=0;
  const hide=G.mods.includes('fog')?520:860;
  setTimeout(()=>{a.el.classList.add('shake');b.el.classList.add('shake');sfx.miss();vib(60)},220);
  setTimeout(()=>{
   a.s=b.s=0;
   [a,b].forEach(x=>x.el.classList.remove('flip','shake'));
   G.lock=false;
   if(G.mods.includes('lives')){G.livesLeft--;renderLives();if(G.livesLeft<=0){lose('lives');return}}
   updHUD();afterPair();
  },hide);
 }
}
function afterPair(){
 if(!G.mods.includes('shuffle'))return;
 const K=Math.max(4,7-Math.floor((G.lvl||0)/50));
 if(G.moves%K===0)reshuffle();
}
function reshuffle(){
 const idx=G.cards.map((c,i)=>c.s===0?i:-1).filter(i=>i>=0);
 if(idx.length<3)return;
 const es=shuffleArr(idx.map(i=>G.cards[i].e),Math.random);
 G.lock=true;
 idx.forEach((i,k)=>{
  const c=G.cards[i];c.e=es[k];
  c.el.querySelector('.back span').textContent=es[k];
  c.el.classList.remove('wobble');void c.el.offsetWidth;c.el.classList.add('wobble');
 });
 sfx.pow();toast('🔀 Cards badal gaye!');
 setTimeout(()=>{G.lock=false;idx.forEach(i=>G.cards[i].el.classList.remove('wobble'))},480);
}
function updHUD(bump){
 $('score').textContent=G.score;
 if(bump){const s=$('score');s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
 const cb=$('combo');
 cb.textContent=G.combo>1?'🔥 COMBO x'+G.combo:'';
 if(G.combo>1){cb.classList.remove('pulse');void cb.offsetWidth;cb.classList.add('pulse')}
 $('nPeek').textContent=G.peeks;$('nFreeze').textContent=G.freezes;
 $('pPeek').disabled=G.peeks<=0;$('pFreeze').disabled=G.freezes<=0;
}
function updTimer(){
 if(!G.time)return;
 const p=Math.max(0,G.left/G.time*100);
 $('timerBar').style.width=p+'%';
 $('timerBar').classList.toggle('low',p<25);
 $('timerTxt').textContent=Math.ceil(G.left)+'s';
}
function timerStart(){
 clearInterval(tm);
 if(!G.time)return;
 tm=setInterval(()=>{
  if(!G||G.over||G.paused)return;
  const n=performance.now(),dt=(n-G.last)/1000;G.last=n;
  if(n<G.frozenUntil)return;
  G.left=Math.max(0,G.left-dt*(G.mods.includes('rush')?1.45:1));updTimer();
  if(G.left<=0)lose('time');
 },100);
}

/* ---------- POWER-UPS ---------- */
function usePeek(){
 if(!G||G.over||G.paused||G.lock||G.peeks<=0)return;
 G.peeks--;G.combo=0;G.lock=true;sfx.pow();vib(30);
 const hid=G.cards.filter(c=>!c.s);
 hid.forEach(c=>c.el.classList.add('flip'));
 updHUD();
 setTimeout(()=>{hid.forEach(c=>{if(!c.s)c.el.classList.remove('flip')});G.lock=false},1300);
}
function useFreeze(){
 if(!G||G.over||G.paused||!G.time||!G.started||G.freezes<=0)return;
 G.freezes--;G.frozenUntil=performance.now()+5000;sfx.pow();vib(30);
 $('timerWrap').classList.add('frozen');updHUD();toast('❄ Time 5 second ke liye ruk gaya!');
 setTimeout(()=>$('timerWrap').classList.remove('frozen'),5000);
}

/* ---------- PAUSE / END ---------- */
function pauseGame(){
 if(!G||G.over||G.paused)return;
 G.paused=true;
 modal('<div class="big">⏸</div><h2>Paused</h2><p style="opacity:.7;margin-top:0">Sans lo, phir wapas aao.</p>'
 +'<button class="btn primary" onclick="resumeGame()">▶ Resume</button>'
 +'<button class="btn" onclick="startGame(G.cfg)">🔄 Restart</button>'
 +'<button class="btn ghost" onclick="quitGame()">🏠 Home</button>');
}
function resumeGame(){G.paused=false;G.last=performance.now();closeModal()}
function quitGame(){if(G)G.over=true;clearInterval(tm);closeModal();refreshHome();go('home')}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&G&&G.started&&!G.over&&!G.paused&&$('game').classList.contains('active'))pauseGame();
});

function win(){
 G.over=true;clearInterval(tm);
 G.bonus=G.time?Math.round(G.left*10):0;G.score+=G.bonus;
 const ratio=G.moves/G.pairs,extra=G.mods.includes('shuffle')?.7:0;
 const stars=ratio<=1.6+extra?3:ratio<=2.4+extra?2:1;
 let xp=0,lv=null;
 if(G.mode==='campaign'){
  S.stars[G.lvl]=Math.max(S.stars[G.lvl]||0,stars);
  S.unlocked=Math.max(S.unlocked,G.lvl+1);
  xp=20+10*stars+G.pairs+(G.boss?40:0);
 }else if(G.mode==='daily'){
  const old=S.daily[G.date];
  if(!old||G.moves<old.moves)S.daily[G.date]={moves:G.moves,score:G.score,stars};
  xp=15+8*stars;
 }else xp=6;
 lv=Player.add(xp);save();updHUD(true);
 G.shareTxt='MEMORA '+(G.mode==='daily'?'Daily '+G.date:G.name)+'\n'+'⭐'.repeat(stars)+' '+G.moves+' moves · '+G.score+' pts · combo x'+G.maxCombo+'\nBeat karke dikhao! '+location.href;
 setTimeout(()=>{sfxc.win();confetti();vib([40,60,40,60,120]);showResult(stars,xp,lv)},650);
}
function showResult(stars,xp,lv){
 const camp=G.mode==='campaign';
 modal('<div class="big">'+(G.boss?'👑':stars===3?'🏆':'🎉')+'</div>'
 +'<h2>'+(camp?(G.boss?'BOSS DEFEATED!':'Level '+G.lvl+' Complete!'):'Shabaash!')+'</h2>'
 +'<div class="stars">'+[1,2,3].map(i=>'<i class="'+(i<=stars?'on':'')+'" style="--d:'+(.25*i)+'s">★</i>').join('')+'</div>'
 +'<div class="xpchip">+'+xp+' XP</div>'+(lv&&lv.up?'<div style="font-weight:900;margin:2px 0 8px">⬆ PLAYER LEVEL '+lv.after+'!</div>':'')
 +'<div class="grid2"><div><small>Score</small><b>'+G.score+'</b></div><div><small>Moves</small><b>'+G.moves+'</b></div>'
 +'<div><small>Best Combo</small><b>x'+G.maxCombo+'</b></div><div><small>'+(G.time?'Time Bonus':'Pairs')+'</small><b>'+(G.time?'+'+G.bonus:G.pairs)+'</b></div></div>'
 +(camp?'<button class="btn primary" onclick="startLevel('+(G.lvl+1)+')">Next Level →</button>':'')
 +(LB.on&&G.mode==='daily'?'<button class="btn primary" onclick="lbSubmit()">🏆 Leaderboard par daalo</button>':'')
 +'<button class="btn" onclick="shareText(G.shareTxt)">📤 Share</button>'
 +'<div class="row2"><button class="btn" onclick="startGame(G.cfg)">🔄 Replay</button>'
 +(camp?'<button class="btn" onclick="openLevels()">🗺 Map</button>':'')
 +'<button class="btn" onclick="quitGame()">🏠 Home</button></div>');
}
function lose(why){
 if(G.over)return;
 G.over=true;clearInterval(tm);sfxc.lose();vib([100,50,100]);
 if(G.mode==='campaign')FAILS[G.lvl]=(FAILS[G.lvl]||0)+1;
 modal('<div class="big">'+(why==='lives'?'💔':'⏰')+'</div><h2>'+(why==='lives'?'Lives Khatam!':'Time Up!')+'</h2>'
 +'<p style="opacity:.8">Aapne '+G.matched+'/'+G.pairs+' pairs jode. Ek aur koshish?</p>'
 +'<button class="btn primary" onclick="startGame(G.cfg)">🔄 Retry</button>'
 +(G.mode==='campaign'&&FAILS[G.lvl]>=3?'<button class="btn" onclick="skipLevel('+G.lvl+')">⏭ Level skip karo (bina stars)</button>':'')
 +'<button class="btn ghost" onclick="quitGame()">🏠 Home</button>');
}

/* ---------- LEADERBOARD ---------- */
function lbOpen(){LB.open('memora-'+todayStr(),'Daily '+todayStr().slice(5))}
function lbSubmit(){LB.submit('memora-'+G.date,'Daily '+G.date.slice(5),G.score)}

refreshHome();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
