<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0720">
<title>MERGEX 2048</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
#goalbar{margin:10px 0 0}
#goalbar .gl{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:5px}
#goalFill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 12px var(--a1);transition:width .35s}
#movesTxt.low{color:#ff6b6b}
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;margin:10px 0}
#board{position:relative;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 60px -18px rgba(0,0,0,.75),0 0 55px -16px var(--a1),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(8px)}
#cells{position:absolute;inset:0;display:grid;padding:var(--gap);gap:var(--gap)}
.cellbg{background:rgba(255,255,255,.07);border-radius:calc(var(--cell)*.14);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .12s ease-out;will-change:transform}
.tile .in{width:100%;height:100%;border-radius:calc(var(--cell)*.14);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);position:relative;overflow:hidden}
.tile .in::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.36),transparent 45%);pointer-events:none}
.tile .in.stone{background:linear-gradient(145deg,#6b7280,#1f2937)!important;color:rgba(255,255,255,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.4)!important}
.spawnIn{animation:spawnIn .25s .12s both}
.spawnNow{animation:spawnIn .3s both}
.mergeIn{animation:mergeIn .3s .1s both}
.popOut{animation:popOut .25s both}
@keyframes spawnIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes mergeIn{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes popOut{to{opacity:0;transform:scale(1.6) rotate(20deg)}}
#board.smashing .tile{cursor:crosshair}
#board.smashing .tile .in{outline:2px dashed #fff;animation:wob .5s ease-in-out infinite alternate}
@keyframes wob{to{transform:scale(.92) rotate(-3deg)}}
.hud .box{min-width:66px}
.pw.sm{flex:0 0 52px}
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i></div>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>

<main id="app">
 <!-- HOME -->
 <section id="home" class="screen active">
  <div class="topbar">
   <a class="icon" href="index.html">‹</a>
   <div class="pbar" id="pbar"></div>
   <button class="icon" onclick="settingsModal()">⚙</button>
  </div>
  <div class="hero">
   <div class="floaty" id="xLogo"></div>
   <div class="wordmark glitch" data-text="MERGEX">MERGEX</div>
   <div class="tagline">Tiles jodo · Limit todo</div>
  </div>
  <div class="menu">
   <button class="btn big primary" onclick="playCurrent()"><span class="bi">▶</span><span class="bt">PLAY<small id="curLabel"></small></span></button>
   <button class="btn" id="btnCont" onclick="continueGame()" style="display:none">↩ Continue</button>
   <div class="row2">
    <button class="btn big" onclick="openLevels()"><span class="bi">🗺</span>Levels</button>
    <button class="btn big" onclick="startDaily()"><span class="bi">📅</span>Daily <span id="dailyBadge"></span></button>
   </div>
   <div class="row2">
    <button class="btn big" onclick="pickSize()"><span class="bi">🎮</span>Classic</button>
    <button class="btn big" id="btnLB" onclick="lbMenu()" style="display:none"><span class="bi">🏆</span>Ranks</button>
   </div>
  </div>
 </section>

 <!-- LEVEL MAP -->
 <section id="levels" class="screen">
  <div class="topbar"><button class="icon" onclick="go('home')">‹</button><div class="pbar" id="pbar2"></div></div>
  <div id="wmBox" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
 </section>

 <!-- GAME -->
 <section id="game" class="screen">
  <header class="hud">
   <button class="icon" onclick="toHome()">‹</button>
   <div class="hud-mid" id="modeName"></div>
   <div class="box"><small>SCORE</small><b id="score">0</b></div>
   <div class="box"><small>BEST</small><b id="best">0</b></div>
  </header>
  <div id="goalbar"><div class="gl"><span id="goalTxt"></span><span id="movesTxt"></span></div><div class="track"><div id="goalFill"></div></div></div>
  <div id="boardWrap"><div id="board"><div id="cells"></div></div></div>
  <footer class="power">
   <button class="pw" id="pUndo" onclick="undo()">↩ Undo <em id="nUndo">3</em></button>
   <button class="pw" id="pSmash" onclick="toggleSmash()">💥 Smash <em id="nSmash">1</em></button>
   <button class="pw sm" onclick="restart()">⟳</button>
   <button class="pw sm" onclick="shareNow()">📤</button>
  </footer>
 </section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="sound.js"></script>
<script src="core.js"></script>
<script src="lb.js"></script>
<script>
Sky.init('hub');fxInit();

/* ---------- SAVE ---------- */
let S={camp:1,cstars:{},best:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('mergex_v2')||'{}'))}catch(e){}
function saveS(){try{localStorage.setItem('mergex_v2',JSON.stringify(S))}catch(e){}}
function onReset(){
 if(!confirm('Mergex ka saara progress delete ho jayega. Pakka?'))return;
 S={camp:1,cstars:{},best:{}};saveS();try{localStorage.removeItem('mergex_save')}catch(e){}
 closeModal();refreshHome();toast('Progress reset ho gaya');
}

/* ---------- infinite campaign levels ---------- */
const TT=[32,64,128,256,256,512,512,512];
const SS=[300,800,1500,2500,3500,4500,5500,6500];
const MM=[8,20,40,70,110,160,200,240];
/* Har level jeetne layak rakha gaya hai (bot se test hua). Difficulty level ~57 tak badhti hai,
   uske baad slow growth + alag board/stones/type ki variety se levels kabhi khatam nahi hote. */
function campSpec(n){
 const tier=Math.min(7,Math.floor((n-1)/8)),type=['tile','score','merges'][(n-1)%3];
 let N=4;
 if(n%11===0)N=3;else if(n%7===0)N=5;
 const boss=n%10===0,t2=Math.min(7,tier+(boss?1:0));
 const grow=n>57?Math.min(1.35,1+Math.floor((n-57)/25)*.05):1;
 let target=type==='tile'?TT[t2]:type==='score'?SS[t2]:MM[t2];
 if(type==='score')target=Math.round(target*grow/50)*50;
 else if(type==='merges')target=Math.round(target*grow);
 if(N===5){target=type==='tile'?Math.min(1024,target*2):type==='score'?Math.round(target*1.6/50)*50:Math.round(target*1.3)}
 if(N===3){target=type==='tile'?Math.min(target,64):type==='score'?Math.min(target,600):Math.min(target,25)}
 let stones=0;
 const sr=(n*37+11)%10;
 if(n>=6&&N!==3&&sr<3&&(type!=='tile'||target<=256||N===5))stones=(N===5&&tier>=4&&sr<1)?2:1;
 const limit=type==='tile'?Math.ceil(target*.57*2)+15+stones*10:0;
 return{n,N,type,target,stones,limit,tier,boss,undos:3+(tier>=3?1:0)+(tier>=5?1:0),smashes:1+(tier>=2?1:0)};
}
function goalText(sp){return sp.type==='tile'?'🎯 Banao '+sp.target:sp.type==='score'?'⭐ Score '+sp.target:'🔗 '+sp.target+' merges'}
function shortSub(sp){
 const k=v=>v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':v;
 return sp.type==='tile'?'🎯'+sp.target:sp.type==='score'?'⭐'+k(sp.target):'🔗'+sp.target;
}

/* ---------- SCREENS ---------- */
function onScreen(id){Sky.setMode(id==='home'?'hub':'game');if(id==='home')Snd.music('hub',3);else if(id==='levels')Snd.music('hub',5);else if(id==='game'&&Snd.mode!=='game'&&Snd.mode!=='boss'&&Snd.mode!=='zen')Snd.music('game',13)}
function refreshHome(){
 const w=worldOf(S.camp);setPalette(w.h1,w.h2);tileHue=w.h1;
 $('pbar').innerHTML=Player.bar();
 $('xLogo').innerHTML=logoMergex(150);
 $('curLabel').textContent='Level '+S.camp+' · '+w.name;
 $('dailyBadge').textContent=S.best['d'+todayStr()]?'✅':'';
 $('btnLB').style.display=LB.on?'flex':'none';
 const sv=loadSave();$('btnCont').style.display=sv&&sv.mode!=='camp'?'block':'none';
 if(sv&&sv.mode!=='camp')$('btnCont').textContent='↩ Continue '+(sv.mode==='daily'?'Daily':sv.N+'×'+sv.N+' Classic');
}
let mapW=0;
function openLevels(){mapW=Math.floor((S.camp-1)/10);renderMap();go('levels');setTimeout(mapFocus,60)}
function renderMap(){
 $('pbar2').innerHTML=Player.bar();
 const w=worldOf(mapW*10+1);setPalette(w.h1,w.h2);
 $('wmBox').innerHTML=mapPage(mapW,{unlocked:S.camp,starsOf:n=>S.cstars[n]||0,pick:'startCamp',subOf:n=>shortSub(campSpec(n))});
}
function mapNav(d){mapW=Math.max(0,mapW+d);renderMap();setTimeout(mapFocus,30)}
function pickSize(){
 modal('<h2>🎮 Classic Mode</h2><p style="opacity:.7;margin-top:0">Board ka size chuno</p>'
 +'<button class="btn" onclick="newGame(5,\'classic\')">🟢 Easy 5×5<small>Zyada jagah, aaram se khelo</small></button>'
 +'<button class="btn primary" onclick="newGame(4,\'classic\')">⭐ Classic 4×4<small>Asli 2048 challenge</small></button>'
 +'<button class="btn" onclick="newGame(3,\'classic\')">🔥 Hard 3×3<small>Sirf expert ke liye</small></button>'
 +'<button class="btn ghost" onclick="closeModal()">Cancel</button>');
}
function startDaily(){newGame(4,'daily')}
function playCurrent(){
 const sv=loadSave();
 if(sv&&sv.mode==='camp'&&sv.lvl===S.camp)continueGame();else startCamp(S.camp);
}

/* ---------- GAME STATE ---------- */
let G=null,cell=80,gap=10,tid=0,tileHue=275;
const bestKey=()=>G.mode==='daily'?'d'+G.date:G.mode==='camp'?'c'+G.N:'s'+G.N;
function modeLabel(){
 if(G.mode==='camp'){const w=worldOf(G.lvl);return w.emoji+' Level '+G.lvl}
 if(G.mode==='daily')return '📅 Daily '+G.date.slice(5);
 return({3:'🔥 Hard 3×3',4:'⭐ Classic 4×4',5:'🟢 Easy 5×5'})[G.N];
}
const pos=i=>gap+i*(cell+gap);
const rsv={s:1};let rs=1;
function rnd(){rs=(rs+0x6D2B79F5)|0;let t=Math.imul(rs^rs>>>15,1|rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

function baseGame(N,mode){
 return{N,mode,date:todayStr(),lvl:0,spec:null,grid:Array(N*N).fill(null),score:0,moves:0,merges:0,undos:3,smashes:1,hist:[],won:false,over:false,smashing:false};
}
function newGame(N,mode){
 closeModal();
 G=baseGame(N,mode);
 rs=mode==='daily'?hash('mergex'+G.date):(Math.random()*4294967296)|0;
 const w=worldOf(1);setPalette(w.h1,w.h2);tileHue=w.h1;
 build();spawn(true);spawn(true);updHUD();persist();
}
function startCamp(n){
 closeModal();
 const sp=campSpec(n);
 G=baseGame(sp.N,'camp');G.lvl=n;G.spec=sp;G.undos=sp.undos;G.smashes=sp.smashes;
 rs=(Math.random()*4294967296)|0;
 const w=worldOf(n);setPalette(w.h1,w.h2);tileHue=w.h1;
 build();
 // stones
 const cells=shuffleArr([...Array(sp.N*sp.N).keys()],Math.random).slice(0,sp.stones);
 cells.forEach(i=>{G.grid[i]=mkTile(-1,Math.floor(i/sp.N),i%sp.N,'spawnNow')});
 spawn(true);spawn(true);updHUD();persist();
 banner(sp.boss?'👑 BOSS LEVEL':'LEVEL '+n,goalText(sp)+(sp.limit?' · '+sp.limit+' moves':''));
}
function restart(){
 if(!G)return;
 modal('<h2>Restart?</h2><p style="opacity:.75">Ye game dobara shuru hoga.</p>'
 +'<button class="btn primary" onclick="restartNow()">🔄 Haan, restart</button><button class="btn ghost" onclick="closeModal()">Cancel</button>');
}
function restartNow(){if(G.mode==='camp')startCamp(G.lvl);else newGame(G.N,G.mode)}
function build(){
 const b=$('board');b.className='';b.innerHTML='<div id="cells"></div>';
 const cl=$('cells');
 cl.style.gridTemplateColumns='repeat('+G.N+',1fr)';cl.style.gridTemplateRows='repeat('+G.N+',1fr)';
 cl.innerHTML='<i class="cellbg"></i>'.repeat(G.N*G.N);
 $('modeName').textContent=modeLabel();
 $('goalbar').style.display=G.mode==='camp'?'block':'none';
 go('game');fit();
 Snd.music(G.mode==='camp'&&G.spec&&G.spec.boss?'boss':'game',G.lvl?worldOf(G.lvl).w*7+3:13);Snd.sfx(G.spec&&G.spec.boss?'boss':'whoosh');if(G.spec&&G.spec.boss){setPalette(350,42);flashFx('#ff2d55')}
}
function fit(){
 if(!G)return;
 const w=$('boardWrap');
 const s=Math.floor(Math.min(w.clientWidth,w.clientHeight,560));
 if(!(s>0))return;
 gap=Math.max(5,Math.round(s*(G.N>4?.022:G.N<4?.04:.03)));
 cell=(s-gap*(G.N+1))/G.N;
 const b=$('board');
 b.style.width=s+'px';b.style.height=s+'px';
 b.style.setProperty('--cell',cell+'px');b.style.setProperty('--gap',gap+'px');
 G.grid.forEach(t=>t&&place(t));
}
addEventListener('resize',fit);

/* ---------- TILES ---------- */
function tileBg(v){
 const k=Math.log2(v),h=(tileHue+k*17)%360;
 return 'linear-gradient(145deg,hsl('+h+' 85% '+Math.min(66,50+k*1.5)+'%),hsl('+((h+25)%360)+' 80% 42%))';
}
function mkTile(v,r,c,anim){
 const el=document.createElement('div');el.className='tile';
 el.innerHTML='<div class="in"></div>';
 const t={id:++tid,v,r,c,el,merged:false};
 paint(t);place(t);
 if(anim)el.firstChild.classList.add(anim);
 $('board').appendChild(el);
 return t;
}
function paint(t){
 const inn=t.el.firstChild;
 if(t.v<0){inn.classList.add('stone');inn.textContent='⬢';inn.style.fontSize='calc(var(--cell)*.4)';return}
 const k=Math.log2(t.v),h=(tileHue+k*17)%360;
 inn.textContent=t.v;
 inn.style.background=tileBg(t.v);
 inn.style.boxShadow=k>=7?'0 0 '+(10+k*2)+'px hsl('+h+' 90% 60% / .75)':'0 4px 10px rgba(0,0,0,.3)';
 const len=String(t.v).length;
 inn.style.fontSize='calc(var(--cell)*'+(len<=2?.46:len===3?.38:len===4?.31:.25)+')';
}
function place(t){t.el.style.transform='translate('+pos(t.c)+'px,'+pos(t.r)+'px)'}
function spawn(now){
 const e=[];G.grid.forEach((t,i)=>{if(!t)e.push(i)});
 if(!e.length)return;
 const i=e[Math.floor(rnd()*e.length)],v=rnd()<.9?2:4;
 G.grid[i]=mkTile(v,Math.floor(i/G.N),i%G.N,now?'spawnNow':'spawnIn');
}
function clearTiles(){
 document.querySelectorAll('#board .tile').forEach(e=>e.remove());
 G.grid=Array(G.N*G.N).fill(null);
}
function fillCells(cells){
 clearTiles();
 cells.forEach((v,i)=>{if(v)G.grid[i]=mkTile(v,Math.floor(i/G.N),i%G.N,null)});
}
const cellsOf=()=>G.grid.map(t=>t?t.v:0);
const maxTile=()=>Math.max(0,...cellsOf());
const snapNow=()=>({cells:cellsOf(),score:G.score,rs,mv:G.moves,mg:G.merges});

const sfx={
 move:()=>Snd.sfx('move'),
 merge:v=>Snd.sfx('merge',v),
 smash:()=>Snd.sfx('smash'),
 undo:()=>Snd.sfx('undo')
};
function burstCell(r,c,v){
 const b=$('board').getBoundingClientRect();
 ringFx(b.left+pos(c)+cell/2,b.top+pos(r)+cell/2,v>=512?'#ffb703':v>=128?'#ff4fa3':'#18d2ff',v>=128?12:8);if(v>=256)shakeEl($('board'),350);if(v>=1024){flashFx('#ffd36b');sparkles(innerWidth/2,innerHeight/2,14)}
 burst(b.left+pos(c)+cell/2,b.top+pos(r)+cell/2,Math.min(40,10+Math.log2(Math.max(2,v))*3));
}
function gainFloat(n){
 const r=$('score').getBoundingClientRect();
 const f=document.createElement('div');f.className='float';f.textContent='+'+n;
 f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height)+'px';
 document.body.appendChild(f);setTimeout(()=>f.remove(),900);
}

/* ---------- MOVE ---------- */
const VEC={left:[0,-1],right:[0,1],up:[-1,0],down:[1,0]};
function move(dir){
 if(!G||G.over||modalOpen||!$('game').classList.contains('active'))return;
 if(G.smashing)toggleSmash();
 const N=G.N,[dr,dc]=VEC[dir];
 const snap=snapNow();
 G.grid.forEach(t=>t&&(t.merged=false));
 const rows=[...Array(N).keys()],cols=[...Array(N).keys()];
 if(dr===1)rows.reverse();
 if(dc===1)cols.reverse();
 let moved=false,gain=0,top=0;const kill=[],mergedAt=[];
 for(const r of rows)for(const c of cols){
  const t=G.grid[r*N+c];
  if(!t||t.v<0)continue;
  let nr=r,nc=c;
  for(;;){
   const pr=nr+dr,pc=nc+dc;
   if(pr<0||pr>=N||pc<0||pc>=N||G.grid[pr*N+pc])break;
   nr=pr;nc=pc;
  }
  const qr=nr+dr,qc=nc+dc;
  const nt=(qr>=0&&qr<N&&qc>=0&&qc<N)?G.grid[qr*N+qc]:null;
  G.grid[r*N+c]=null;
  if(nt&&nt.v===t.v&&!nt.merged){
   const m=mkTile(t.v*2,qr,qc,'mergeIn');
   m.merged=true;G.grid[qr*N+qc]=m;
   t.r=qr;t.c=qc;place(t);
   kill.push(t,nt);mergedAt.push(m);
   gain+=m.v;top=Math.max(top,m.v);moved=true;
  }else{
   G.grid[nr*N+nc]=t;
   if(nr!==r||nc!==c){t.r=nr;t.c=nc;place(t);moved=true}
  }
 }
 if(!moved)return;
 setTimeout(()=>kill.forEach(t=>t.el.remove()),130);
 G.hist.push(snap);if(G.hist.length>20)G.hist.shift();
 G.score+=gain;G.moves++;G.merges+=mergedAt.length;
 spawn(false);
 if(gain){
  sfx.merge(top);vib(top>=128?[20,30,30]:12);gainFloat(gain);
  mergedAt.filter(m=>m.v>=64).forEach(m=>setTimeout(()=>burstCell(m.r,m.c,m.v),120));
 }else sfx.move();
 updHUD(!!gain);
 if(G.mode==='camp'){
  if(goalMet()){campWin();return}
  if(G.spec.limit&&G.moves>=G.spec.limit){G.over=true;persist();setTimeout(()=>campFail('moves'),500);return}
  if(!canMove()){G.over=true;persist();setTimeout(()=>campFail('stuck'),600);return}
  persist();return;
 }
 if(top>=2048&&!G.won){G.won=true;persist();setTimeout(showWin,450);return}
 if(!canMove()){G.over=true;persist();setTimeout(showOver,600);return}
 persist();
}
function canMove(){
 const N=G.N;
 if(G.grid.some(t=>!t))return true;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const v=G.grid[r*N+c].v;if(v<0)continue;
  if(c<N-1&&G.grid[r*N+c+1].v===v)return true;
  if(r<N-1&&G.grid[(r+1)*N+c].v===v)return true;
 }
 return false;
}
function goalMet(){
 const s=G.spec;
 return s.type==='tile'?maxTile()>=s.target:s.type==='score'?G.score>=s.target:G.merges>=s.target;
}
function goalPct(){
 const s=G.spec;
 const v=s.type==='tile'?Math.log2(Math.max(2,maxTile()))/Math.log2(s.target):s.type==='score'?G.score/s.target:G.merges/s.target;
 return Math.max(0,Math.min(100,Math.round(v*100)));
}
function updHUD(bump){
 const k=bestKey();
 if(G.score>(S.best[k]||0)){S.best[k]=G.score;saveS()}
 $('score').textContent=G.score;$('best').textContent=S.best[k]||0;
 if(bump){const s=$('score');s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
 $('nUndo').textContent=G.undos;$('nSmash').textContent=G.smashes;
 $('pUndo').disabled=G.undos<=0||!G.hist.length;
 $('pSmash').disabled=G.smashes<=0&&!G.smashing;
 if(G.mode==='camp'){
  $('goalTxt').textContent=goalText(G.spec);
  const left=G.spec.limit?G.spec.limit-G.moves:null;
  $('movesTxt').textContent=left===null?'Moves '+G.moves:'Moves left '+Math.max(0,left);
  $('movesTxt').classList.toggle('low',left!==null&&left<=10);
  $('goalFill').style.width=goalPct()+'%';
 }
}

/* ---------- POWER-UPS ---------- */
function undo(){
 if(!G||(modalOpen&&!G.over))return;
 if(G.undos<=0||!G.hist.length)return;
 const s=G.hist.pop();
 G.undos--;G.over=false;G.score=s.score;rs=s.rs;G.moves=s.mv;G.merges=s.mg;
 closeModal();fillCells(s.cells);sfx.undo();vib(15);updHUD();persist();
}
function toggleSmash(){
 if(!G||G.over||modalOpen)return;
 if(G.smashes<=0&&!G.smashing)return;
 G.smashing=!G.smashing;
 $('board').classList.toggle('smashing',G.smashing);
 if(G.smashing)toast('💥 Kisi bhi tile par tap karo');
 updHUD();
}
function smashAt(target){
 const el=target&&target.closest?target.closest('.tile'):null;
 const t=G.grid.find(x=>x&&x.el===el);
 if(!t)return;
 G.hist.push(snapNow());if(G.hist.length>20)G.hist.shift();
 G.grid[t.r*G.N+t.c]=null;
 t.el.firstChild.className='in popOut';setTimeout(()=>t.el.remove(),260);
 burstCell(t.r,t.c,Math.max(t.v,64));
 G.smashes--;G.smashing=false;$('board').classList.remove('smashing');
 sfx.smash();vib(35);updHUD();persist();
}

/* ---------- INPUT ---------- */
document.addEventListener('keydown',e=>{
 const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'}[e.key];
 if(m){e.preventDefault();move(m)}
});
const bw=$('boardWrap');let px=0,py=0,pid=null;
bw.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;pid=e.pointerId});
bw.addEventListener('pointercancel',()=>{pid=null});
bw.addEventListener('pointerup',e=>{
 if(pid===null)return;pid=null;
 const dx=e.clientX-px,dy=e.clientY-py,ax=Math.abs(dx),ay=Math.abs(dy);
 if(Math.max(ax,ay)<14){if(G&&G.smashing)smashAt(e.target);return}
 move(ax>ay?(dx>0?'right':'left'):(dy>0?'down':'up'));
});

/* ---------- SAVE / RESUME ---------- */
function persist(){
 try{
  if(!G||G.over)localStorage.removeItem('mergex_save');
  else localStorage.setItem('mergex_save',JSON.stringify({N:G.N,mode:G.mode,lvl:G.lvl,date:G.date,cells:cellsOf(),score:G.score,moves:G.moves,merges:G.merges,undos:G.undos,smashes:G.smashes,won:G.won,rs}));
 }catch(e){}
}
function loadSave(){
 try{
  const s=JSON.parse(localStorage.getItem('mergex_save')||'null');
  if(s&&s.N&&Array.isArray(s.cells)&&s.cells.length===s.N*s.N)return s;
 }catch(e){}
 return null;
}
function continueGame(){
 const s=loadSave();if(!s)return newGame(4,'classic');
 closeModal();
 G=baseGame(s.N,s.mode);
 G.date=s.date;G.lvl=s.lvl||0;G.score=s.score;G.moves=s.moves||0;G.merges=s.merges||0;G.undos=s.undos;G.smashes=s.smashes;G.won=s.won;
 if(s.mode==='camp')G.spec=campSpec(G.lvl);
 rs=s.rs;
 const w=s.mode==='camp'?worldOf(G.lvl):worldOf(1);setPalette(w.h1,w.h2);tileHue=w.h1;
 build();fillCells(s.cells);updHUD();
}
function toHome(){persist();closeModal();refreshHome();go('home')}

/* ---------- RESULTS ---------- */
function shareMsg(){
 const what=G.mode==='camp'?'Level '+G.lvl:G.mode==='daily'?'Daily '+G.date:G.N+'×'+G.N;
 return 'MERGEX 2048 '+what+'\n🔥 Score '+G.score+' · Best tile '+maxTile()+'\nBeat karke dikhao! '+location.href;
}
function shareNow(){if(G)shareText(shareMsg())}
function campWin(){
 G.over=true;persist();
 const sp=G.spec;
 let stars;
 if(sp.limit){const left=(sp.limit-G.moves)/sp.limit;stars=left>=.3?3:left>=.12?2:1}
 else{const used=3-G.undos+(1-G.smashes);stars=used===0?3:used<=1?2:1}
 S.cstars[G.lvl]=Math.max(S.cstars[G.lvl]||0,stars);
 S.camp=Math.max(S.camp,G.lvl+1);saveS();
 const xp=25+12*stars+sp.tier*5+(sp.boss?40:0),lv=Player.add(xp);
 setTimeout(()=>{
  sfxc.win();confetti();cannons();vib([40,60,40,60,120]);
  modal('<div class="big">'+(sp.boss?'👑':stars===3?'🏆':'🎉')+'</div><h2>'+(sp.boss?'BOSS DEFEATED!':'Level '+G.lvl+' Complete!')+'</h2>'
  +'<div class="stars">'+[1,2,3].map(i=>'<i class="'+(i<=stars?'on':'')+'" style="--d:'+(.25*i)+'s">★</i>').join('')+'</div>'
  +'<div class="xpchip">+'+xp+' XP</div>'+(lv.up?'<div style="font-weight:900;margin:2px 0 8px">⬆ PLAYER LEVEL '+lv.after+'!</div>':'')
  +'<div class="grid2"><div><small>Score</small><b>'+G.score+'</b></div><div><small>Moves</small><b>'+G.moves+'</b></div></div>'
  +'<button class="btn primary" onclick="startCamp('+(G.lvl+1)+')">Next Level →</button>'
  +'<button class="btn" onclick="shareNow()">📤 Share</button>'
  +'<div class="row2"><button class="btn" onclick="startCamp('+G.lvl+')">🔄 Replay</button><button class="btn" onclick="openLevels()">🗺 Map</button><button class="btn" onclick="toHome()">🏠 Home</button></div>');
 },500);
}
function campFail(why){
 sfxc.lose();vib([100,50,100]);
 const msg=why==='moves'?'Moves khatam ho gaye!':'Board jam ho gaya!';
 modal('<div class="big">'+(why==='moves'?'⌛':'💥')+'</div><h2>'+msg+'</h2>'
 +'<p style="opacity:.8;margin-top:0">'+goalText(G.spec)+' · aapka score '+G.score+'</p>'
 +(G.undos>0&&G.hist.length?'<button class="btn primary" onclick="undo()">↩ Last move undo karo ('+G.undos+')</button>':'')
 +'<button class="btn '+(G.undos>0&&G.hist.length?'':'primary')+'" onclick="startCamp('+G.lvl+')">🔄 Retry</button>'
 +'<div class="row2"><button class="btn" onclick="openLevels()">🗺 Map</button><button class="btn" onclick="toHome()">🏠 Home</button></div>');
}
function showWin(){
 sfxc.win();confetti();cannons();vib([40,60,40,60,120]);
 modal('<div class="big">🏆</div><h2>2048 BAN GAYA!</h2><p style="opacity:.8;margin-top:0">Aap champion ho. Ab aur aage jao?</p>'
 +'<div class="grid2"><div><small>Score</small><b>'+G.score+'</b></div><div><small>Best Tile</small><b>'+maxTile()+'</b></div></div>'
 +'<button class="btn primary" onclick="closeModal()">▶ Khelte raho</button>'
 +lbBtn()+'<button class="btn" onclick="shareNow()">📤 Share</button>'
 +'<button class="btn ghost" onclick="pickSize()">🎮 New Game</button>');
}
function showOver(){
 sfxc.lose();vib([100,50,100]);
 const k=bestKey(),isBest=G.score>0&&G.score>=(S.best[k]||0);
 modal('<div class="big">'+(isBest?'🎉':'💥')+'</div><h2>'+(isBest?'Naya Record!':'Game Over')+'</h2>'
 +'<div class="grid2"><div><small>Score</small><b>'+G.score+'</b></div><div><small>Best Tile</small><b>'+maxTile()+'</b></div></div>'
 +(G.undos>0&&G.hist.length?'<button class="btn primary" onclick="undo()">↩ Last move undo karo ('+G.undos+')</button>':'')
 +'<button class="btn '+(G.undos>0&&G.hist.length?'':'primary')+'" onclick="newGame(G.N,G.mode)">🔄 Phir se khelo</button>'
 +lbBtn()+'<button class="btn" onclick="shareNow()">📤 Share</button>'
 +'<button class="btn ghost" onclick="toHome()">🏠 Home</button>');
}

/* ---------- LEADERBOARD ---------- */
function lbInfo(){
 return G.mode==='daily'?['mergex-daily-'+G.date,'Daily '+G.date.slice(5)]:['mergex-'+G.N,({3:'Hard 3×3',4:'Classic 4×4',5:'Easy 5×5'})[G.N]+' · All-time'];
}
function lbBtn(){return LB.on&&G.mode!=='camp'?'<button class="btn" onclick="lbSubmit()">🏆 Leaderboard par daalo</button>':''}
function lbSubmit(){const i=lbInfo();LB.submit(i[0],i[1],G.score)}
function lbMenu(){
 const d=todayStr();
 modal('<h2>🏆 Leaderboard</h2>'
 +'<button class="btn primary" onclick="LB.open(\'mergex-daily-'+d+'\',\'Daily '+d.slice(5)+'\')">📅 Aaj ka Daily</button>'
 +'<button class="btn" onclick="LB.open(\'mergex-4\',\'Classic 4×4 · All-time\')">⭐ Classic 4×4</button>'
 +'<button class="btn" onclick="LB.open(\'mergex-5\',\'Easy 5×5 · All-time\')">🟢 Easy 5×5</button>'
 +'<button class="btn" onclick="LB.open(\'mergex-3\',\'Hard 3×3 · All-time\')">🔥 Hard 3×3</button>'
 +'<button class="btn ghost" onclick="closeModal()">Close</button>');
}

refreshHome();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
Snd.music('hub',3);
</script>
